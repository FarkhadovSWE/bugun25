<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Page</title>
</head>
<body>
    <h1>{{ selected_category }}</h1>

    {% for news in category_news %}
        <h2><a href="/news/{{ news.id }}/">{{ news.title }}</a></h2>
        <p>{{ news.created_at}}</p>
    {% endfor %}
</body>
</html>
