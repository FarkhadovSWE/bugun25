<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    {% for category in categories %}
        <h3>{{ category }}</h3>
    {% endfor %}

    <h1>Latest news...</h1>

    {% for news in latest_news %}
        <h2><a href="/news/{{ news.id }}/">{{ news.title }}</a></h2>
        <p>{{ news.created_at}}</p>
    {% endfor %}
</body>
</html>
